[package]
name = "TasCat"
version = "0.1.0"
edition = "2021"
authors = ["Milo Auguste III"]

[package.metadata.winres]
OriginalFilename = "TasCat.exe"
LegalCopyright = "Copyright (c) Milo Auguste III"
ProductName = "TasCat"
FileDescription = "AI-powered file operations via right-click context menu"
ProductVersion = "0.1"
FileVersion = "0.1"
CompanyName = "Milo Auguste III"
icon = "TasCat.ico"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"
walkdir = "2.3"
winreg = "0.10"
regex = "1.0"
chrono = "0.4"
dirs = "5.0"
# Add new dependencies
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "fileapi"] }

[build-dependencies]
winres = "0.1"