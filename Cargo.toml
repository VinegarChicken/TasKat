[package]
name = "TasKat"
version = "0.1.0"
edition = "2021"
authors = ["Milo Auguste III"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"
walkdir = "2.0"
winreg = "0.10"
regex = "1.0"
chrono = "0.4"
dirs = "5.0"